<!DOCTYPE html>
<html lang="en">

<body>
    <table>
        <tr>
            <th>Name</th>

        <tr>
            <td>Kanishka Gupta</td>

            <td>Delhi</td>
        </tr>
        <tr>
            <td>John Doe</td>
            <td>25</td>
            <td>New York</td>
        </tr>
    </table>
    <h2>Simple Form</h2>
    <form action="submit.php" method="post" target="_blank">
        <label for="name">Name:</label>
        <input type="text"name="name" placeholder="Enter Your First Name"><br><br>
        <label for="middlename">Middle Name:</label>
        <input type="text" name="middlename" placeholder="Enter Your Middle Name"><br><br>
        <label for="lastname">Last Name:</label>
        <input type="text" name="lastname" placeholder="Enter Your Last Name"><br><br>
        <label for="number">Phone Number:</label>
        <input type="tel" id="number" name="number" placeholder="Enter Your Phone Number"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter Your Email"><br><br>
        <label for="Description">Description:</label>
        <textarea id="Description" name="Description" rows="4" cols="50" placeholder="Enter Your Description"></textarea><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter Your Password"><br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>

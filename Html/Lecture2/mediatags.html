<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h1>My Media Page</h1>

    <h2>Audio Example</h2>
    <audio controls>
        <source src="https://0e805edb-703e-4e6e-8466-db4f8269680a.mdnplay.dev/shared-assets/audio/t-rex-roar.mp3" type="audio/mpeg">

    <h2>Video Example</h2>
    <video width="320" height="240" controls>
        <source src="https://a9dfca65-6999-4356-9b8a-5f82b968066e.mdnplay.dev/shared-assets/videos/flower.webm" type="video/webm">

    <h2>Iframe Example</h2>
    <iframe src="https://supporting.openstreetmap.org/donate/" title="Inline Frame Example" width="300" height="200"></iframe>  
    <h2>Embed Example</h2>
    <embed src="https://studyglance.in/lecturenotes/data/HTML%28WT%29%20Lecture%20Notes.pdf" width="300" height="200" type="text/css">
    h2>Object Example</h2>
    <object data="https://studyglance.in/lecturenotes/data/HTML%28WT%29%20Lecture%20Notes.pdf" type="application/pdf" width="300" height="200">
        <p>Your browser does not support PDFs. <a href="https://studyglance.in/lecturenotes/data/HTML%28WT%29%20Lecture%20Notes.pdf">Download the PDF</a>.</p>  
    </object>
    <h2>Canvas Example</h2>
    <canvas width="300" height="200"></canvas>
</body>
</html>

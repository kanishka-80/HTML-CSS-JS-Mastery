<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <!-- Internal Style -->
    <style>
        h1 {
            color: red;
            text-align: center;
        }
        /* p {
            color: blue;
            font-size: 20px;
        } */
    </style>
</head>
<body>
     <!-- Inline Style -->
    <h1 style="color: red; text-align: center;"> Hello World </h1>
    <h2>This is a heading</h2>
     <p>lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas, voluptate.</p></p>
    <p style="color: blue; font-size: 20px;"> This is a paragraph </p>
    <div>
        <p>
            Direct Child of div, so it will be blue and 20px font size because of the internal style.
        </p>
        <section>
            <p>
                Not a direct child of div, so it will not be affected by the internal style.
            </p>
        </section>
    </div>
</body>
</html>
